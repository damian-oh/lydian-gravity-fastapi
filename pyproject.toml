[project]
name = "lydian-gravity-fastapi"
version = "0.1.0"
description = "A FastAPI backend for generating harmonic suggestions based on Modal Harmony and the Lydian Chromatic Concept"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.135.2",
    "pwdlib>=0.3.0",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]
